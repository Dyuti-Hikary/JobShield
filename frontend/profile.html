<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobShield - My Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
        }

        .navbar {
            background: #1769aa;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 24px;
        }

        .logout-btn {
            background: white;
            color: #1769aa;
            border: none;
            padding: 9px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            color: #222;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #666;
        }

        .profile-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #1769aa;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }

        .profile-header h2 {
            color: #222;
        }

        .profile-header p {
            color: #777;
            margin-top: 5px;
        }

        .info {
            display: grid;
            gap: 18px;
        }

        .info-box {
            padding: 16px;
            background: #f7f9fc;
            border-radius: 10px;
        }

        .info-box strong {
            display: block;
            color: #555;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .info-box span {
            color: #222;
            font-size: 16px;
        }

        .back-home {
            display: inline-block;
            margin-top: 25px;
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h1>JobShield</h1>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </nav>

    <main class="container">

        <div class="welcome">
            <h2>My Profile</h2>
            <p>Welcome to your JobShield account.</p>
        </div>

        <div class="profile-card">

            <div class="profile-header">

                <div class="avatar" id="avatar">
                    U
                </div>

                <div>
                    <h2 id="profileName">
                        User
                    </h2>

                    <p id="profileRole">
                        Job Seeker
                    </p>
                </div>

            </div>

            <div class="info">

                <div class="info-box">
                    <strong>Full Name</strong>
                    <span id="name">
                        Not available
                    </span>
                </div>

                <div class="info-box">
                    <strong>Email Address</strong>
                    <span id="email">
                        Not available
                    </span>
                </div>

                <div class="info-box">
                    <strong>Account Type</strong>
                    <span id="role">
                        Not available
                    </span>
                </div>

            </div>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </main>


    <script>

        const user = JSON.parse(
            localStorage.getItem("jobshieldUser")
        );

        if (user) {

            document.getElementById("profileName")
                .textContent = user.name || "User";

            document.getElementById("name")
                .textContent = user.name || "Not available";

            document.getElementById("email")
                .textContent = user.email || "Not available";

            document.getElementById("role")
                .textContent = user.role || "Not available";

            document.getElementById("profileRole")
                .textContent = user.role || "User";

            if (user.name) {
                document.getElementById("avatar")
                    .textContent =
                    user.name.charAt(0).toUpperCase();
            }

        }


        function logout() {

            localStorage.removeItem("jobshieldUser");

            window.location.href = "login.html";

        }

    </script>

</body>
</html>
