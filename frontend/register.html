<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobShield - Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #1769aa;
            font-size: 32px;
        }

        .logo p {
            color: #777;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #1769aa;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #125589;
        }

        .signup-btn:disabled {
            background: #9bbbd3;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .login a {
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 15px;
        }

        .back a {
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">
            <h1>JobShield</h1>
            <p>Create your account</p>
        </div>


        <form id="signupForm">

            <!-- Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    required
                >

            </div>


            <!-- Role -->
            <div class="form-group">

                <label for="role">
                    Account Type
                </label>

                <select id="role" required>

                    <option value="">
                        Select account type
                    </option>

                    <option value="Job Seeker">
                        Job Seeker
                    </option>

                    <option value="Employer">
                        Employer
                    </option>

                    <option value="Recruitment Agency">
                        Recruitment Agency
                    </option>

                </select>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

            </div>


            <!-- Button -->
            <button
                type="submit"
                class="signup-btn"
                id="signupButton"
            >
                Create Account
            </button>


            <!-- Message -->
            <div
                id="message"
                class="message">
            </div>

        </form>


        <!-- Login -->
        <div class="login">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <!-- Back -->
        <div class="back">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>


    <script>

        const signupForm =
            document.getElementById("signupForm");

        const signupButton =
            document.getElementById("signupButton");

        const message =
            document.getElementById("message");


        signupForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const role =
                    document
                        .getElementById("role")
                        .value;

                const password =
                    document
                        .getElementById("password")
                        .value;

                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                // Check password

                if (password !== confirmPassword) {

                    message.style.color = "red";

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }


                if (password.length < 6) {

                    message.style.color = "red";

                    message.textContent =
                        "Password must be at least 6 characters.";

                    return;
                }


                // Disable button

                signupButton.disabled = true;

                signupButton.textContent =
                    "Creating Account...";

                message.textContent = "";


                try {

                    /*
                     * Backend API
                     *
                     * This URL will be replaced after
                     * the backend is deployed.
                     */

                    const API_URL =
                        "YOUR_BACKEND_URL/api/register";


                    const response =
                        await fetch(API_URL, {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                name: name,
                                email: email,
                                role: role,
                                password: password

                            })

                        });


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Registration failed."
                        );

                    }


                    message.style.color =
                        "green";

                    message.textContent =
                        "Account created successfully!";


                    // Go to login page

                    setTimeout(function() {

                        window.location.href =
                            "login.html";

                    }, 1200);


                } catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );


                    message.style.color =
                        "red";

                    message.textContent =
                        error.message ||
                        "Registration failed.";

                }


                signupButton.disabled = false;

                signupButton.textContent =
                    "Create Account";

            });

    </script>

</body>
</html>
