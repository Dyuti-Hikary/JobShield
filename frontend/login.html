<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobShield - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo h1 {
            color: #1769aa;
            font-size: 32px;
        }

        .logo p {
            color: #777;
            margin-top: 8px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1769aa;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #125589;
        }

        .login-btn:disabled {
            background: #9bbbd3;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }

        .register a {
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 15px;
        }

        .back a {
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 18px;
        }

        .forgot a {
            color: #1769aa;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>JobShield</h1>
            <p>Secure Job Verification Platform</p>
        </div>


        <form id="loginForm">

            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Forgot Password -->
            <div class="forgot">

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <!-- Login Button -->
            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Login
            </button>


            <!-- Message -->
            <div
                id="message"
                class="message">
            </div>

        </form>


        <!-- Register -->
        <div class="register">

            Don't have an account?

            <a href="register.html">
                Sign Up
            </a>

        </div>


        <!-- Back -->
        <div class="back">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                // Basic validation

                if (!email || !password) {

                    message.style.color = "red";

                    message.textContent =
                        "Please enter your email and password.";

                    return;
                }


                // Disable button

                loginButton.disabled = true;

                loginButton.textContent =
                    "Logging in...";

                message.textContent = "";


                try {

                    /*
                     * Backend API
                     *
                     * IMPORTANT:
                     * Replace this URL with your deployed
                     * backend URL when the backend is online.
                     */

                    const API_URL =
                        "YOUR_BACKEND_URL/api/login";


                    const response =
                        await fetch(API_URL, {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })

                        });


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Invalid email or password."
                        );

                    }


                    // Save logged-in user

                    localStorage.setItem(
                        "jobshieldUser",
                        JSON.stringify(data.user)
                    );


                    message.style.color =
                        "green";

                    message.textContent =
                        "Login successful!";


                    // Redirect to profile

                    setTimeout(function() {

                        window.location.href =
                            "profile.html";

                    }, 700);


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    message.style.color =
                        "red";


                    message.textContent =
                        error.message ||
                        "Login failed. Please try again.";

                }


                // Enable button again

                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";

            });

    </script>

</body>
</html>
